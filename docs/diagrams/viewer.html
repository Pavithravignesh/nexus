<!doctype html>
<html><head><meta charset="utf-8"><title>Nexus diagrams</title>
<style>body{margin:0;font-family:sans-serif;background:#f1f3f5}nav{position:sticky;top:0;background:#212529;padding:8px 16px}nav a{color:#fff;margin-right:16px}section{padding:16px}svg{background:#fff;max-width:100%;height:auto;box-shadow:0 1px 4px #0002}</style>
<script>window.EXCALIDRAW_ASSET_PATH="https://cdn.jsdelivr.net/npm/@excalidraw/excalidraw@0.17.6/dist/";</script>
<script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@excalidraw/excalidraw@0.17.6/dist/excalidraw.production.min.js"></script>
</head><body>
<nav><a href="#d1">1 · HLD</a><a href="#d2">2 · Architecture</a><a href="#d3">3 · Wireframe</a> <span style="color:#adb5bd">Open the .excalidraw files at excalidraw.com to edit</span></nav>
<section id="d1"></section><section id="d2"></section><section id="d3"></section>
<script>
const files=[["d1","01-hld.excalidraw"],["d2","02-architecture.excalidraw"],["d3","03-wireframe.excalidraw"]];
(async()=>{for(const [id,f] of files){const j=await (await fetch(f)).json();
const svg=await ExcalidrawLib.exportToSvg({elements:j.elements,appState:{...j.appState,exportBackground:true,exportPadding:24},files:{}});
document.getElementById(id).appendChild(svg);}document.title="Nexus diagrams (rendered)";})().catch(e=>{document.body.insertAdjacentHTML("beforeend","<pre>"+e.stack+"</pre>")});
</script></body></html>
